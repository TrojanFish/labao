# =============================================================
# LaBao Nginx Configuration — Production VPS
# Place at: /etc/nginx/sites-available/labao.app
# Symlink:  ln -s /etc/nginx/sites-available/labao.app /etc/nginx/sites-enabled/
# =============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=assets:10m  rate=100r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name labao.app www.labao.app;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://labao.app$request_uri;
    }
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.labao.app;

    ssl_certificate     /etc/letsencrypt/live/labao.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labao.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://labao.app$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labao.app;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/labao.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labao.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Root ---
    root /var/www/labao/dist;
    index index.html;

    # --- Logging ---
    access_log /var/log/nginx/labao.access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/labao.error.log warn;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # --- Security Headers ---
    add_header X-Frame-Options                        "DENY"                            always;
    add_header X-Content-Type-Options                 "nosniff"                         always;
    add_header X-XSS-Protection                       "1; mode=block"                   always;
    add_header Referrer-Policy                        "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy             "same-origin"                     always;
    add_header Cross-Origin-Resource-Policy           "same-origin"                     always;
    add_header Permissions-Policy                     "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security              "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy               "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://labao.app; connect-src 'self' https://api.open-meteo.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://www.strava.com https://api-v3.strava.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Strava OAuth API Proxy (Node.js Serverless / Express Backend) ---
    # 如在 VPS 启用 Strava OAuth 服务端代理 (例如运行 Node.js 独立服务在 3001 端口)
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # --- SPA Routing (React HashRouter / BrowserRouter fallback) ---
    location / {
        limit_req zone=general burst=50 nodelay;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- Immutable hashed assets (Vite generates /assets/xxx.hash.js) ---
    location /assets/ {
        limit_req zone=assets burst=200 nodelay;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- PWA service worker (never cache) ---
    location = /sw.js {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # --- PWA manifest ---
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        default_type application/manifest+json;
    }

    # --- SEO files ---
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        default_type application/xml;
    }

    # --- Static icons & images ---
    location ~* \.(ico|png|jpg|jpeg|webp|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --- Block hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
