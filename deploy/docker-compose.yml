version: '3.8'

services:
  # ─── YoloCycling App (Nginx serving built SPA) ───────────────────
  yolocycling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: yolocycling_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from Certbot
      - certbot_certs:/etc/letsencrypt:ro
      # Certbot webroot for ACME challenges
      - certbot_www:/var/www/certbot:ro
    networks:
      - yolocycling_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Certbot (Let's Encrypt SSL auto-renewal) ───────────────
  certbot:
    image: certbot/certbot:latest
    container_name: yolocycling_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run renewal check every 12 hours
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 43200 & wait $${!};
             done"
    networks:
      - yolocycling_net

volumes:
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

networks:
  yolocycling_net:
    driver: bridge
