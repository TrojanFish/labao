<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <!-- Background Gradient (YoloCycling Spicy Chili to Neon Orange) -->
    <linearGradient id="yoloBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF5E3A" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Ambient & Key Shadow for iOS 18 -->
    <filter id="iconShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8B1D00" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B1D00" flood-opacity="0.25" />
    </filter>

    <filter id="glyphShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B0A00" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Continuous iOS 18 Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#yoloBg)" />

  <!-- Top Specular Highlight -->
  <line x1="0" y1="3" x2="512" y2="3" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4" />

  <!-- The Aero Spicy Burger Emblem -->
  <g filter="url(#glyphShadow)" transform="translate(56, 56) scale(4)" fill="#FFFFFF">
    <!-- Top Bun -->
    <path d="M 22 41 C 22 22, 38 16, 50 16 C 62 16, 78 22, 78 41 C 78 43.5, 75.5 44.5, 73 44.5 L 27 44.5 C 24.5 44.5, 22 43.5, 22 41 Z" fill="#FFFFFF" />
    
    <!-- Aero Helmet Vents / Sesame -->
    <ellipse cx="36" cy="28" rx="3.2" ry="1.4" transform="rotate(-22 36 28)" fill="url(#yoloBg)" />
    <ellipse cx="49" cy="24" rx="3.5" ry="1.5" transform="rotate(-3 49 24)" fill="url(#yoloBg)" />
    <ellipse cx="63" cy="27" rx="3.2" ry="1.4" transform="rotate(18 63 27)" fill="url(#yoloBg)" />
    <ellipse cx="42" cy="35" rx="3" ry="1.3" transform="rotate(-15 42 35)" fill="url(#yoloBg)" opacity="0.85" />
    <ellipse cx="57" cy="35" rx="3" ry="1.3" transform="rotate(12 57 35)" fill="url(#yoloBg)" opacity="0.85" />

    <!-- Middle Layer: Road Chainring Teeth & Speed Wake -->
    <path d="M 6 49.5 L 18 49.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 10 54 L 18 54" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 82 49.5 L 94 49.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 82 54 L 90 54" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

    <path d="M 19 50 L 22 46.5 L 25.5 46.5 L 27.5 50 L 31 46.5 L 34.5 46.5 L 36.5 50 L 40 46.5 L 43.5 46.5 L 45.5 50 L 49 46.5 L 52.5 46.5 L 54.5 50 L 58 46.5 L 61.5 46.5 L 63.5 50 L 67 46.5 L 70.5 46.5 L 72.5 50 L 76 46.5 L 79.5 46.5 L 81 50 L 81 55 L 79.5 57.5 L 76 57.5 L 74 55 L 70.5 57.5 L 67 57.5 L 65 55 L 61.5 57.5 L 58 57.5 L 56 55 L 52.5 57.5 L 49 57.5 L 47 55 L 43.5 57.5 L 40 57.5 L 38 55 L 34.5 57.5 L 31 57.5 L 29 55 L 25.5 57.5 L 22 57.5 L 19 55 Z" fill="#FFFFFF" />

    <!-- Chainring Cutouts -->
    <circle cx="50" cy="51.5" r="3.2" fill="url(#yoloBg)" />
    <circle cx="36" cy="51.5" r="2" fill="url(#yoloBg)" />
    <circle cx="64" cy="51.5" r="2" fill="url(#yoloBg)" />

    <!-- Spicy Flame Drop -->
    <path d="M 68 56 Q 71 61.5 73.5 62 Q 75.5 61 76 56 Z" fill="#FFFFFF" />

    <!-- Bottom Bun -->
    <path d="M 24 60.5 L 76 60.5 C 78.5 60.5, 79.5 62, 78.5 64.5 C 76.5 72.5, 66 78, 50 78 C 34 78, 23.5 72.5, 21.5 64.5 C 20.5 62, 21.5 60.5, 24 60.5 Z" fill="#FFFFFF" />

    <!-- Lower Ground Diffusers -->
    <path d="M 32 83 L 68 83" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 40 87.5 L 60 87.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>